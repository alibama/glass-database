="Helvetica,Arial,sans-serif">cast plinth 15 x 4 in</text><rect x="329.25" y="322" width="159.5" height="154" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/><rect x="343.0" y="355" width="132" height="121" fill="#9fd3e6" stroke="#1a1a1a" stroke-width="1.2"/><text x="409.0" y="415.5" font-size="11" text-anchor="middle" fill="#246" font-weight="normal" font-family="Helvetica,Arial,sans-serif">glass, 100 lb</text><text x="409.0" y="341.8" font-size="10" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">invested crucible 12 x 14 in</text><rect x="211" y="129.5" width="374" height="60.5" fill="#e8d7a8" stroke="#1a1a1a" stroke-width="1.2"/><rect x="233" y="151.5" width="330" height="38.5" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="1.2"/><rect x="381.5" y="107.5" width="33" height="82.5" fill="#d9b38c" stroke="#1a1a1a" stroke-width="1.2"/><text x="398.0" y="98.7" font-size="10" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">removable lid: 3 in cast slab in an angle pan, 2 in board above; a 3 in flue with a damper on the gas option</text><circle cx="321.0" cy="300" r="5.5" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="321.0" cy="267" r="5.5" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="497.0" cy="300" r="5.5" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="497.0" cy="267" r="5.5" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><line x1="502.5" y1="283.5" x2="660" y2="283.5" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><text x="666" y="287.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">SiC elements, 1 in, through both</text><text x="666" y="300.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">side walls, 2 and 5 in above the rim</text><text x="666" y="313.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">(electric option)</text><rect x="376.0" y="212" width="66" height="88" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5,3"/><line x1="442.0" y1="228.5" x2="660" y2="228.5" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><text x="666" y="232.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">gathering port 6 x 8 in in the</text><text x="666" y="245.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">front wall; sill 2 in above the rim;</text><text x="666" y="258.5" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3 in cast door, counterweighted</text><rect x="260.5" y="454" width="27.5" height="33" fill="#d9b38c" stroke="#1a1a1a" stroke-width="1.2"/><line x1="260.5" y1="470.5" x2="170" y2="470.5" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/><text x="164" y="464.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">burner block, tangential,</text><text x="164" y="477.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3 in above the floor</text><text x="164" y="490.5" font-size="10" text-anchor="end" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">(gas option)</text><rect x="211" y="591.5" width="16.5" height="88" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><rect x="568.5" y="591.5" width="16.5" height="88" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><line x1="130" y1="679.5" x2="666" y2="679.5" stroke="#333" stroke-width="2"/><line x1="200" y1="705.5" x2="596" y2="705.5" stroke="#555" stroke-width="1"/><line x1="200" y1="700.5" x2="200" y2="710.5" stroke="#555" stroke-width="1"/><line x1="596" y1="700.5" x2="596" y2="710.5" stroke=