<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ffffff"/><text x="24" y="30" font-size="17" text-anchor="start" fill="#1a1a1a" font-weight="bold" font-family="Helvetica,Arial,sans-serif">Glory hole, 16 in bore: longitudinal section (schematic, not to scale)</text><rect x="160" y="128" width="330" height="264" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><rect x="160" y="132.4" width="330" height="255.2" fill="#f9e7b0" stroke="#1a1a1a" stroke-width="1.2"/><rect x="160" y="161" width="330" height="198" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="1.2"/><rect x="204" y="172" width="286" height="176" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/><rect x="160" y="161" width="44" height="198" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="1.2"/><line x1="237" y1="88" x2="237" y2="172" stroke="#b36b00" stroke-width="6"/><text x="245" y="104" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">forced-air burner, tangential, 4 in from the back wall</text><text x="245" y="118" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">2 in mixer body, 2.5 in burner block</text><rect x="490" y="128" width="16.5" height="264" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><rect x="506.5" y="150" width="27.5" height="77" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="1.2"/><rect x="506.5" y="293" width="27.5" height="77" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="506.5" cy="150" r="4" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="506.5" cy="370" r="4" fill="#333" stroke="#1a1a1a" stroke-width="1.2"/><text x="539.5" y="194" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">half-moon doors, 2.5 in cast,</text><text x="539.5" y="208" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">on 3/4 in pivots; foot pedal</text><text x="539.5" y="222" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">or two air cylinders</text><line x1="506.5" y1="227" x2="506.5" y2="293" stroke="#c33" stroke-width="2" stroke-dasharray="4,3"/><text x="539.5" y="262" font-size="10" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">6 in half-open stop for the pipe</text><rect x="182" y="392" width="22" height="154" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><rect x="446" y="392" width="22" height="154" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><rect x="171" y="392" width="308" height="11" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="1.2"/><line x1="100" y1="546" x2="630" y2="546" stroke="#333" stroke-width="2"/><text x="325.0" y="496.5" font-size="10" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">2 x 2 in angle stand, 6 in adjustment;</text><text x="325.0" y="509.5" font-size="10" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">bore centre 40 to 44 in off the floor</text><rect x="248" y="414" width="88" height="55" fill="#ddd" stroke="#1a1a1a" stroke-width="1.2"/><text x="292" y="447" font-size="10" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">blower 250 CFM</text><line x1="160" y1="68" x2="490" y2="68" stroke="#555" stroke-width="1"/><line x1="160" y1="63" x2="160" y2="73" stroke="#555" stroke-width="1"/><line x1="490" y1="63" x2="490" y2="73" stroke="#555" stroke-width="1"/><text x="325.0" y="62" font-size="11" text-anchor="middle" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">30 in shell; 26 in bore depth</text><line x1="130" y1="128" x2="130" y2="392" stroke="#555" stroke-width="1"/><line x1="125" y1="128" x2="135" y2="128" stroke="#555" stroke-width="1"/><line x1="125" y1="392" x2="135" y2="392" stroke="#555" stroke-width="1"/><text x="114" y="264.0" font-size="11" fill="#333" font-family="Helvetica,Arial,sans-serif" transform="rotate(-90 114 264.0)" text-anchor="middle">24 in shell OD</text><line x1="90" y1="172" x2="90" y2="348" stroke="#555" stroke-width="1"/><line x1="85" y1="172" x2="95" y2="172" stroke="#555" stroke-width="1"/><line x1="85" y1="348" x2="95" y2="348" stroke="#555" stroke-width="1"/><text x="74" y="264.0" font-size="11" fill="#333" font-family="Helvetica,Arial,sans-serif" transform="rotate(-90 74 264.0)" text-anchor="middle">16 in bore</text><rect x="560" y="410" width="14" height="12" fill="#9aa0a6" stroke="#1a1a1a" stroke-width="0.8"/><text x="580" y="420" font-size="11" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">14 ga rolled steel shell</text><rect x="560" y="428" width="14" height="12" fill="#f9e7b0" stroke="#1a1a1a" stroke-width="0.8"/><text x="580" y="438" font-size="11" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">3 in 2600 F fiber blanket, two layers</text><rect x="560" y="446" width="14" height="12" fill="#c9c3b8" stroke="#1a1a1a" stroke-width="0.8"/><text x="580" y="456" font-size="11" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">1 in 3000 F cast hot face; 4 in cast back wall</text><rect x="560" y="464" width="14" height="12" fill="#b36b00" stroke="#1a1a1a" stroke-width="0.8"/><text x="580" y="474" font-size="11" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">burner</text><text x="24" y="580" font-size="11" text-anchor="start" fill="#333" font-weight="normal" font-family="Helvetica,Arial,sans-serif">The flame enters on a tangent, wraps the bore and leaves through the door opening; the damperless chamber runs slightly positive, so the hood above it matters.</text></svg>