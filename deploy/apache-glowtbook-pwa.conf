# Glowtbook PWA layer — makes the Glowtbook page installable on iOS/Android.
# Include this INSIDE the HTTPS (:443) vhost for glassdatabase.org, alongside the
# existing reverse-proxy Include. Requires: a2enmod substitute filter headers alias
#
#   Include /opt/glassdatabase/deploy/apache-glowtbook-pwa.conf
#
# 1) Serve the static PWA assets straight from disk (bypass the proxy for these).
Alias /glowtbook/pwa            /opt/glassdatabase/deploy/pwa
Alias /glowtbook/manifest.webmanifest  /opt/glassdatabase/deploy/pwa/manifest.webmanifest
<Directory /opt/glassdatabase/deploy/pwa>
    Require all granted
    Options -Indexes
</Directory>
<Location /glowtbook/pwa>
    ProxyPass !
</Location>
<Location /glowtbook/manifest.webmanifest>
    ProxyPass !
    Header set Content-Type "application/manifest+json"
</Location>

# 2) Inject the manifest + apple meta + service-worker registration into the
#    Streamlit HTML <head>. We ask Streamlit for uncompressed HTML so the text
#    filter can rewrite it, then let Apache re-compress on the way out.
<Location /glowtbook/>
    RequestHeader unset Accept-Encoding
    AddOutputFilterByType SUBSTITUTE text/html
    SubstituteMaxLineLength 20m
    Substitute "s|</head>|<link rel=\"manifest\" href=\"/glowtbook/manifest.webmanifest\"><meta name=\"theme-color\" content=\"#6b21a8\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"Glowtbook\"><link rel=\"apple-touch-icon\" href=\"/glowtbook/pwa/icons/apple-touch-icon.png\"><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/glowtbook/pwa/sw.js').catch(function(){})})}</script></head>|in"
</Location>
