# Glass Database — Apache :80 vhost (thin). All proxy rules live in the shared
# snippet, which certbot's :443 vhost also inherits when it copies this file —
# so HTTP and HTTPS can never drift. `certbot --apache` adds the TLS vhost.

<VirtualHost *:80>
    ServerName glassdatabase.org
    ServerAlias www.glassdatabase.org
    DocumentRoot /opt/glassdatabase/public

    IncludeOptional /etc/apache2/glassdatabase-proxy.conf

    <Directory /opt/glassdatabase/public>
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/glassdatabase-error.log
    CustomLog ${APACHE_LOG_DIR}/glassdatabase-access.log combined
</VirtualHost>
