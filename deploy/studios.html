<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Studios Worldwide — Glass Database</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Archivo:wght@100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/field-data.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:"Archivo",system-ui,sans-serif;}
  #topnav{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:1rem;
    padding:0 1rem;background:#0A0D11;border-bottom:1px solid var(--fd-rule);z-index:900;overflow-x:auto;}
  #topnav .brand{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    color:var(--fd-bone);font-size:12px;white-space:nowrap;}
  #topnav a{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fd-dim);text-decoration:none;white-space:nowrap;}
  #topnav a:hover{color:var(--fd-amber);}
  #topnav .sp{margin-left:auto;}
  #app{position:fixed;inset:48px 0 0 0;display:flex;background:var(--fd-bg-top);color:var(--fd-bone);}
  #panel{width:min(340px,86vw);flex:0 0 auto;padding:1.4rem 1.3rem;overflow:auto;
    border-right:1px solid var(--fd-rule);background:linear-gradient(180deg,#0E0B09,#12100E);z-index:500;}
  #map{flex:1;background:#0A0D11;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    color:var(--fd-amber);font-size:12px;}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-variation-settings:"opsz" 44,"wght" 340;
    font-size:clamp(26px,4vw,34px);color:var(--fd-bone);margin:.5rem 0 .3rem;line-height:1.1;}
  .count{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;color:var(--fd-dim);}
  .rule{height:1px;background:var(--fd-rule-soft);margin:1rem 0;}
  #search{width:100%;box-sizing:border-box;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--fd-rule-soft);
    background:rgba(238,231,219,.05);color:var(--fd-bone);font-size:.95rem;}
  #search::placeholder{color:var(--fd-faint);}
  .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--fd-faint);margin:1.2rem 0 .6rem;}
  .pills{display:flex;flex-wrap:wrap;gap:.4rem;}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    padding:.4rem .7rem;border-radius:999px;border:1px solid var(--fd-rule-soft);color:var(--fd-dim);
    cursor:pointer;user-select:none;background:transparent;transition:.15s;}
  .pill[data-on="1"]{color:var(--fd-bg-top);}
  .actions{display:flex;gap:.4rem;margin-top:1.1rem;}
  .actions button{flex:1;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:.55rem 0;border-radius:8px;border:1px solid var(--fd-rule-soft);
    background:transparent;color:var(--fd-dim);cursor:pointer;}
  .actions button:hover{border-color:var(--fd-amber);color:var(--fd-amber);}
  .handle{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--fd-faint);
    text-decoration:none;display:inline-block;margin-top:1.4rem;}
  /* leaflet popup -> Field Data */
  .leaflet-popup-content-wrapper{background:#12100E;color:var(--fd-bone);border:1px solid var(--fd-rule);
    border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.6);}
  .leaflet-popup-tip{background:#12100E;border:1px solid var(--fd-rule);}
  .leaflet-popup-content{margin:1rem 1.1rem;font-family:"Archivo",sans-serif;}
  .pop-name{font-family:"Fraunces",serif;font-weight:400;font-size:19px;color:var(--fd-bone);margin:0 0 .2rem;}
  .pop-loc{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fd-dim);}
  .pop-type{display:inline-block;margin-top:.6rem;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;border-radius:999px;border:1px solid var(--fd-rule-soft);}
  .pop-web{display:inline-block;margin-top:.7rem;font-family:"IBM Plex Mono",monospace;font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--fd-amber);text-decoration:none;}
  .leaflet-control-attribution{background:rgba(10,13,17,.7)!important;color:var(--fd-faint)!important;}
  .leaflet-control-attribution a{color:var(--fd-dim)!important;}
  .leaflet-bar a{background:#12100E!important;color:var(--fd-bone)!important;border-color:var(--fd-rule)!important;}
  @media (max-width:720px){ #app{flex-direction:column;} #panel{width:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--fd-rule);} }
</style>
</head>
<body class="fd-ground">
<nav id="topnav">
  <a class="brand" href="/">Glass&nbsp;Database</a>
  <a href="/explore/">Explore</a>
  <a href="/glowtbook/">Glowtbook</a>
  <a href="/studios.html" style="color:var(--fd-amber)">Map</a>
  <a href="/graph.html">Graph</a>
  <a href="/api/docs">API</a>
  <a class="sp" href="https://discord.gg/9ek2UxvPT">Discord</a>
</nav>
<div id="app">
  <aside id="panel">
    <p class="eyebrow">The Glass Database</p>
    <h1>Glass Studios<br>Worldwide</h1>
    <p class="count" id="count">loading…</p>
    <div class="rule"></div>
    <input id="search" placeholder="Search studio, city, country…" aria-label="Search studios">
    <p class="lbl">Filter by type</p>
    <div class="pills" id="typePills"></div>
    <div class="actions">
      <button id="allBtn">All</button>
      <button id="noneBtn">None</button>
      <button id="resetBtn">Reset view</button>
    </div>
    <a class="handle" href="/">← glassdatabase.org</a>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RAMP = ["#E8A44A","#5EC8BD","#967AD2","#E25836","#EEE7DB","#A8A29A"];
const map = L.map("map",{zoomControl:true,worldCopyJump:true}).setView([25,10],2);
function addTiles(cfg){
  L.tileLayer(cfg.url, {subdomains:cfg.subdomains||"abcd", maxZoom:cfg.maxZoom||19,
    attribution:cfg.attribution||"&copy; OpenStreetMap &copy; CARTO"}).addTo(map);
}
fetch("/api/map-config.json").then(r=>r.json()).then(addTiles).catch(()=>addTiles({
  url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  attribution:"&copy; OpenStreetMap &copy; CARTO &middot; The Glass Database"}));

let ALL=[], TYPES=[], onTypes=new Set(), layer=L.layerGroup().addTo(map), colorOf={};
const $ = s => document.querySelector(s);

function color(t){ return colorOf[t] || "#A8A29A"; }
function marker(f){
  const [lng,lat]=f.geometry.coordinates, p=f.properties||{}, c=color(p.type||"");
  const m=L.circleMarker([lat,lng],{radius:7,color:c,weight:2,fillColor:c,fillOpacity:.55,
    className:"studio-dot"});
  const loc=[p.city,p.region,p.country].filter(Boolean).join(" · ");
  const web=p.website ? `<a class="pop-web" href="${p.website}" target="_blank" rel="noopener">Website →</a>` : "";
  const led=p.led_by ? `<p style="margin:.6rem 0 0;color:var(--fd-dim)"><strong style="color:var(--fd-bone)">Led by</strong> — ${p.led_by}</p>`:"";
  const notes=p.notes ? `<p style="margin:.5rem 0 0;color:var(--fd-dim);font-style:italic">${p.notes}</p>`:"";
  m.bindPopup(`<p class="pop-name">${p.name||"Studio"}</p>`+
    `<p class="pop-loc">${loc}</p>`+
    (p.type?`<span class="pop-type" style="color:${c};border-color:${c}">${p.type}</span>`:"")+
    led+notes+(p.founded?`<p class="pop-loc" style="margin-top:.6rem">Founded ${p.founded}</p>`:"")+web);
  m._props=p; return m;
}
function render(){
  const q=($("#search").value||"").toLowerCase().trim();
  layer.clearLayers(); let shown=0;
  ALL.forEach(f=>{
    const p=f.properties||{};
    if(onTypes.size && !onTypes.has(p.type||"")) return;
    if(q){ const hay=[p.name,p.city,p.region,p.country,p.type].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return; }
    layer.addLayer(marker(f)); shown++;
  });
  const countries=new Set(ALL.map(f=>(f.properties||{}).country).filter(Boolean)).size;
  $("#count").textContent = `${shown} stud${shown===1?"y":"ios"} shown · ${countries} countries`;
}
function drawPills(){
  const box=$("#typePills"); box.innerHTML="";
  TYPES.forEach((t,i)=>{
    colorOf[t]=RAMP[i%RAMP.length];
    const el=document.createElement("span");
    el.className="pill"; el.textContent=t||"Other";
    el.style.borderColor=colorOf[t];
    const paint=()=>{ const on=onTypes.has(t); el.dataset.on=on?"1":"0";
      el.style.background=on?colorOf[t]:"transparent"; el.style.color=on?"#0A0D11":"var(--fd-dim)"; };
    el.onclick=()=>{ onTypes.has(t)?onTypes.delete(t):onTypes.add(t); paint(); render(); };
    paint(); box.appendChild(el);
  });
}
$("#search").addEventListener("input", render);
$("#allBtn").onclick=()=>{ onTypes=new Set(TYPES); drawPills(); render(); };
$("#noneBtn").onclick=()=>{ onTypes.clear(); drawPills(); render(); };
$("#resetBtn").onclick=()=>{ map.setView([25,10],2); };

fetch("/api/studios.geojson").then(r=>r.json()).then(gj=>{
  ALL = gj.features||[];
  TYPES = [...new Set(ALL.map(f=>(f.properties||{}).type).filter(Boolean))].sort();
  drawPills(); render();
  if(ALL.length){ try{ const b=L.latLngBounds(ALL.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]]));
    map.fitBounds(b.pad(0.2)); }catch(e){} }
}).catch(()=>{ $("#count").textContent="couldn't load studios"; });
</script>
</body>
</html>
