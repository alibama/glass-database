# Native Streamlit theme. The `brand` package paints the Field Data look on top
# (Fraunces headings, the furnace nav bar, molten buttons), but anything the
# CSS cannot reach — dropdown menus and date pickers rendered in portals,
# tooltips, dataframes, toasts — takes its colours from here. Keep it the same
# dark palette as the CSS so nothing falls back to light-on-light.
[theme]
base = "dark"
primaryColor = "#E8A44A"
backgroundColor = "#12100E"
secondaryBackgroundColor = "#1D1712"
textColor = "#EEE7DB"
font = "sans serif"
