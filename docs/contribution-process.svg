<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="470" rx="18" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.5"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#0f172a">Contributing an object — moderation &amp; provenance (BPMN)</text>

  <!-- ===== pool + lanes ===== -->
  <rect x="40" y="64" width="1160" height="366" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- pool name strip -->
  <rect x="40" y="64" width="30" height="366" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="55" y="247" font-size="12.5" font-weight="600" fill="#475569" transform="rotate(-90 55 247)" text-anchor="middle">Object contribution</text>

  <!-- lane bands -->
  <rect x="70" y="64"  width="30" height="122" fill="#f0fdf4" stroke="#cbd5e1"/>
  <rect x="70" y="186" width="30" height="122" fill="#eff6ff" stroke="#cbd5e1"/>
  <rect x="70" y="308" width="30" height="122" fill="#fdf2f8" stroke="#cbd5e1"/>
  <line x1="100" y1="186" x2="1200" y2="186" stroke="#cbd5e1"/>
  <line x1="100" y1="308" x2="1200" y2="308" stroke="#cbd5e1"/>
  <text x="85" y="125" font-size="12" font-weight="600" fill="#166534" transform="rotate(-90 85 125)" text-anchor="middle">Contributor</text>
  <text x="85" y="247" font-size="12" font-weight="600" fill="#1e40af" transform="rotate(-90 85 247)" text-anchor="middle">Glowtbook</text>
  <text x="85" y="369" font-size="12" font-weight="600" fill="#9d174d" transform="rotate(-90 85 369)" text-anchor="middle">Admin</text>

  <!-- ===== flows (drawn first, under nodes) ===== -->
  <g fill="none" stroke="#64748b" stroke-width="2">
    <path d="M126 125 H150" marker-end="url(#f)"/>              <!-- start -> add -->
    <path d="M300 125 H305" marker-end="url(#f)"/>              <!-- add -> submit -->
    <path d="M370 153 V222" marker-end="url(#f)"/>              <!-- submit -> condense -->
    <path d="M435 247 H445" marker-end="url(#f)"/>              <!-- condense -> sign -->
    <path d="M520 275 V369 H590" marker-end="url(#f)"/>         <!-- sign -> review -->
    <path d="M730 369 H766" marker-end="url(#f)"/>              <!-- review -> gateway -->
    <path d="M790 345 V247 H840" marker-end="url(#f)"/>         <!-- gateway yes -> publish -->
    <path d="M814 369 H892" marker-end="url(#f)"/>              <!-- gateway no -> reject -->
    <path d="M980 247 H990" marker-end="url(#f)"/>              <!-- publish -> bluesky -->
    <path d="M1110 247 H1142" marker-end="url(#f)"/>            <!-- bluesky -> end -->
  </g>
  <text x="800" y="300" font-size="11" fill="#16a34a">yes</text>
  <text x="828" y="362" font-size="11" fill="#b91c1c">no</text>

  <!-- ===== nodes ===== -->
  <!-- start -->
  <circle cx="110" cy="125" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="165" font-size="10.5" fill="#475569" text-anchor="middle">New object</text>

  <g font-size="11.5" fill="#1f2937" text-anchor="middle">
    <!-- contributor tasks -->
    <rect x="150" y="97" width="150" height="56" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="225" y="121">Add originals</text><text x="225" y="137">&amp; provenance</text>

    <rect x="305" y="97" width="130" height="56" rx="9" fill="#f0fdf4" stroke="#86efac"/>
    <text x="370" y="129">Submit for review</text>

    <!-- system tasks -->
    <rect x="305" y="219" width="130" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="370" y="243">Condense → DIP</text><text x="370" y="259">(transcode video)</text>

    <rect x="445" y="219" width="150" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="520" y="243">Sign C2PA ·</text><text x="520" y="259">bag AIP → MinIO</text>

    <rect x="840" y="219" width="140" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="910" y="243">Publish DIP</text><text x="910" y="259">to registry</text>

    <rect x="990" y="219" width="120" height="56" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="1050" y="243">Post to Bluesky</text><text x="1050" y="259">(optional)</text>

    <!-- admin task -->
    <rect x="590" y="341" width="140" height="56" rx="9" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="660" y="373">Review submission</text>
  </g>

  <!-- gateway (exclusive) -->
  <g>
    <path d="M790 345 L814 369 L790 393 L766 369 Z" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <path d="M782 361 L798 377 M798 361 L782 377" stroke="#a16207" stroke-width="2"/>
    <text x="790" y="335" font-size="10.5" fill="#475569" text-anchor="middle">Approve?</text>
  </g>

  <!-- end: rejected -->
  <circle cx="910" cy="369" r="17" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="910" y="405" font-size="10.5" fill="#475569" text-anchor="middle">Rejected</text>

  <!-- end: public -->
  <circle cx="1160" cy="247" r="17" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1160" y="285" font-size="10.5" fill="#475569" text-anchor="middle">Public</text>

  <text x="40" y="456" font-size="11" fill="#94a3b8">Moderation is on by default (GLASSDB_MODERATION=1). Editable BPMN 2.0 source: docs/contribution-process.bpmn</text>
</svg>
