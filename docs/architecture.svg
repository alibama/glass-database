<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- self-contained light card so it reads on light OR dark GitHub themes -->
  <rect x="0" y="0" width="960" height="560" rx="18" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.5"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Glass Database — architecture</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Local-first. One SQLite / Turso database. Every service reads a self-describing registry.</text>

  <!-- ============ data pipeline ============ -->
  <g font-size="12.5">
    <rect x="40" y="104" width="150" height="58" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="115" y="129" text-anchor="middle" font-weight="600" fill="#3730a3">Spreadsheets</text>
    <text x="115" y="147" text-anchor="middle" fill="#4f46e5">.xlsx</text>

    <line x1="192" y1="133" x2="232" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="234" y="104" width="168" height="58" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="318" y="129" text-anchor="middle" font-weight="600" fill="#155e75">central/ingest.py</text>
    <text x="318" y="147" text-anchor="middle" fill="#0e7490">re-runnable importer</text>

    <line x1="404" y1="133" x2="444" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="446" y="96" width="196" height="74" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="544" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">glassdb.db</text>
    <text x="544" y="148" text-anchor="middle" font-size="11.5" fill="#b45309">SQLite · WAL · Turso-ready</text>

    <text x="672" y="118" font-size="11.5" fill="#64748b">_datasets / _columns</text>
    <text x="672" y="135" font-size="11.5" fill="#64748b">→ generic API &amp; explorer</text>
    <text x="672" y="152" font-size="11.5" fill="#64748b">→ private columns withheld</text>
  </g>

  <!-- ============ services behind the reverse proxy ============ -->
  <text x="40" y="210" font-size="12" font-weight="600" fill="#475569">Reverse proxy — Apache / nginx · HTTPS · systemd services</text>
  <rect x="40" y="222" width="880" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- bus from the DB down into the proxy band -->
  <line x1="544" y1="170" x2="544" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="12">
    <!-- API -->
    <rect x="58" y="242" width="200" height="82" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="72" y="266" font-size="14" font-weight="700" fill="#1e40af">API</text>
    <text x="246" y="266" text-anchor="end" font-size="11" fill="#3b82f6">:8000 · /docs</text>
    <text x="72" y="288" fill="#334155">read-only, self-</text>
    <text x="72" y="305" fill="#334155">documenting (FastAPI)</text>

    <!-- Explore -->
    <rect x="272" y="242" width="200" height="82" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="286" y="266" font-size="14" font-weight="700" fill="#166534">Explore</text>
    <text x="460" y="266" text-anchor="end" font-size="11" fill="#22c55e">:8502</text>
    <text x="286" y="288" fill="#334155">break-downs · charts</text>
    <text x="286" y="305" fill="#334155">studio map · downloads</text>

    <!-- Admin -->
    <rect x="486" y="242" width="200" height="82" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="500" y="266" font-size="14" font-weight="700" fill="#991b1b">Admin</text>
    <text x="674" y="266" text-anchor="end" font-size="11" fill="#ef4444">:8501</text>
    <text x="500" y="288" fill="#334155">content · moderation</text>
    <text x="500" y="305" fill="#334155">de-duplication</text>

    <!-- Glowtbook -->
    <rect x="700" y="242" width="200" height="82" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="714" y="266" font-size="14" font-weight="700" fill="#6b21a8">Glowtbook</text>
    <text x="888" y="266" text-anchor="end" font-size="11" fill="#a855f7">:8503</text>
    <text x="714" y="288" fill="#334155">objects · provenance</text>
    <text x="714" y="305" fill="#334155">journal · contribute</text>
  </g>

  <!-- ============ storage / provenance outputs from Glowtbook ============ -->
  <text x="40" y="378" font-size="12" font-weight="600" fill="#475569">Glowtbook keeps the master, publishes a condensed copy (OAIS)</text>

  <!-- two arrows down from Glowtbook card -->
  <line x1="770" y1="324" x2="720" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="830" y1="324" x2="470" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g font-size="12.5">
    <!-- AIP -->
    <rect x="40" y="394" width="410" height="120" rx="14" fill="#fefce8" stroke="#fde68a"/>
    <text x="60" y="420" font-size="14" font-weight="700" fill="#854d0e">AIP — archival</text>
    <text x="60" y="443" fill="#3f3f46">Originals, untouched · BagIt bag</text>
    <text x="60" y="462" fill="#3f3f46">(sha256 + sha512 fixity, private</text>
    <text x="60" y="481" fill="#3f3f46">value/insurance in metadata.json)</text>
    <rect x="300" y="452" width="128" height="40" rx="9" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="364" y="477" text-anchor="middle" font-weight="600" fill="#52525b">MinIO / S3</text>
    <line x1="292" y1="472" x2="298" y2="472" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- DIP -->
    <rect x="470" y="394" width="450" height="120" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="490" y="420" font-size="14" font-weight="700" fill="#075985">DIP — dissemination (public)</text>
    <text x="490" y="443" fill="#3f3f46">Downscaled images, transcoded video</text>
    <text x="490" y="462" fill="#3f3f46">+ poster, C2PA-signed manifest</text>
    <text x="490" y="486" font-size="11.5" fill="#0369a1">→ served by the API · verifiable at contentcredentials.org</text>
    <text x="490" y="503" font-size="11.5" fill="#0369a1">→ moderated before public · optional Bluesky receipt</text>
  </g>

  <text x="40" y="540" font-size="11" fill="#94a3b8">Code: Apache-2.0 · Data &amp; ontology: CC-BY-4.0 · glassdatabase.org</text>
</svg>
