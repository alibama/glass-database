<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="1080" height="720" rx="18" fill="#ffffff" stroke="#e6e8ec" stroke-width="1.5"/>
  <text x="40" y="44" font-size="23" font-weight="700" fill="#0f172a">Glass object fingerprinting — protocol</text>
  <text x="40" y="67" font-size="12.5" fill="#64748b">Re-identify a physical piece from photos, bound to C2PA provenance. Descriptors (not images) are the identity; matching runs in the browser.</text>

  <!-- ===================== ENROL lane ===================== -->
  <rect x="24" y="88" width="1032" height="292" rx="14" fill="#fbf7ff" stroke="#ecd9fb"/>
  <text x="40" y="110" font-size="13" font-weight="700" fill="#6b21a8">ENROL  ·  logged in  ·  on the ArUco capture mat</text>

  <!-- capture -->
  <rect x="40" y="124" width="150" height="120" rx="11" fill="#fff" stroke="#e2ddea"/>
  <text x="115" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Capture</text>
  <text x="52" y="168" font-size="11" fill="#475569">Orbit slowly, 2–3</text>
  <text x="52" y="184" font-size="11" fill="#475569">heights; fill frame,</text>
  <text x="52" y="200" font-size="11" fill="#475569">keep 4 markers in.</text>
  <text x="52" y="222" font-size="11" fill="#7c3aed">Novelty gate keeps</text>
  <text x="52" y="237" font-size="11" fill="#7c3aed">only new views.</text>

  <!-- descriptors -->
  <line x1="190" y1="184" x2="222" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="224" y="124" width="242" height="180" rx="11" fill="#fff" stroke="#e2ddea"/>
  <text x="345" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Per-frame descriptors</text>
  <rect x="238" y="158" width="214" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="248" y="175" font-size="11.5" font-weight="600" fill="#9a3412">Colour histogram (64)</text>
  <text x="248" y="190" font-size="10.5" fill="#b45309">primary · white-balanced to mat</text>
  <rect x="238" y="202" width="214" height="36" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="248" y="218" font-size="11.5" font-weight="600" fill="#475569">dHash (64-bit)</text>
  <text x="248" y="231" font-size="10.5" fill="#64748b">coverage/novelty gate only</text>
  <rect x="238" y="242" width="214" height="50" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="248" y="259" font-size="11.5" font-weight="600" fill="#075985">DINOv2 embedding (384)</text>
  <text x="248" y="273" font-size="10.5" fill="#0369a1">texture · in-browser · SAMPLED:</text>
  <text x="248" y="286" font-size="10.5" fill="#0369a1">capped (EMB_CAP≈8), pooled, quantised</text>

  <!-- aggregate + measure -->
  <line x1="466" y1="184" x2="498" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="500" y="124" width="168" height="180" rx="11" fill="#fff" stroke="#e2ddea"/>
  <text x="584" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Aggregate</text>
  <text x="512" y="168" font-size="11" fill="#475569">Rating / tier</text>
  <text x="512" y="184" font-size="11" fill="#475569">(coverage + detail).</text>
  <rect x="512" y="198" width="144" height="52" rx="8" fill="#fefce8" stroke="#fde68a"/>
  <text x="522" y="216" font-size="11.5" font-weight="600" fill="#854d0e">Measure (mat)</text>
  <text x="522" y="230" font-size="10.5" fill="#3f3f46">ArUco 30 mm → mm/px</text>
  <text x="522" y="243" font-size="10.5" fill="#3f3f46">→ W×D×H (server, OpenCV)</text>
  <text x="512" y="272" font-size="10.5" fill="#64748b">dominant colour,</text>
  <text x="512" y="286" font-size="10.5" fill="#64748b">dimensions → metadata</text>

  <!-- sign + store -->
  <line x1="668" y1="184" x2="700" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="702" y="124" width="176" height="180" rx="11" fill="#fff" stroke="#e2ddea"/>
  <text x="790" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Sign &amp; store</text>
  <rect x="714" y="158" width="152" height="66" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="724" y="176" font-size="11" font-weight="600" fill="#3730a3">C2PA attestation</text>
  <text x="724" y="191" font-size="10.5" fill="#4f46e5">rating, tier, colour,</text>
  <text x="724" y="204" font-size="10.5" fill="#4f46e5">views, algorithm +</text>
  <text x="724" y="217" font-size="10.5" fill="#4f46e5">fingerprint_sha256</text>
  <text x="714" y="244" font-size="10.5" fill="#475569">Raw fingerprint → object</text>
  <text x="714" y="258" font-size="10.5" fill="#475569">record (descriptors only;</text>
  <text x="714" y="272" font-size="10.5" fill="#475569">photos stay in the AIP).</text>

  <!-- approval gate -->
  <line x1="878" y1="184" x2="910" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="912" y="140" width="128" height="128" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="976" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Approval</text>
  <text x="976" y="196" text-anchor="middle" font-size="10.5" fill="#3f6212">pending →</text>
  <text x="976" y="210" text-anchor="middle" font-size="10.5" fill="#3f6212">admin approves</text>
  <text x="976" y="230" text-anchor="middle" font-size="10.5" fill="#3f6212">→ public in</text>
  <text x="976" y="244" text-anchor="middle" font-size="10.5" fill="#3f6212">the registry</text>

  <!-- registry hub -->
  <line x1="976" y1="268" x2="976" y2="418" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="430" y="404" width="240" height="58" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="550" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Registry</text>
  <text x="550" y="449" text-anchor="middle" font-size="11" fill="#b45309">/api/objects/&lt;id&gt;/fingerprint</text>
  <line x1="912" y1="433" x2="672" y2="433" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===================== VERIFY lane ===================== -->
  <rect x="24" y="486" width="1032" height="210" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="40" y="508" font-size="13" font-weight="700" fill="#075985">VERIFY  ·  anyone, anytime  ·  matching runs in the browser (capture never leaves the device)</text>

  <line x1="550" y1="462" x2="550" y2="486" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="524" width="168" height="140" rx="11" fill="#fff" stroke="#cfe6f5"/>
  <text x="124" y="546" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Load reference</text>
  <text x="52" y="568" font-size="11" fill="#475569">verify.html?object=id</text>
  <text x="52" y="584" font-size="11" fill="#475569">pulls the registered</text>
  <text x="52" y="600" font-size="11" fill="#475569">fingerprint.</text>

  <line x1="208" y1="594" x2="240" y2="594" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="242" y="524" width="180" height="140" rx="11" fill="#fff" stroke="#cfe6f5"/>
  <text x="332" y="546" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Capture &amp; match</text>
  <text x="254" y="568" font-size="11" fill="#475569">Same descriptors</text>
  <text x="254" y="584" font-size="11" fill="#475569">(white balance, cap).</text>
  <text x="254" y="606" font-size="11" fill="#0369a1">Prefers DINOv2 when</text>
  <text x="254" y="621" font-size="11" fill="#0369a1">the reference has it;</text>
  <text x="254" y="636" font-size="11" fill="#0369a1">else colour correlation.</text>

  <line x1="422" y1="594" x2="454" y2="594" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="456" y="524" width="228" height="140" rx="11" fill="#fff" stroke="#cfe6f5"/>
  <text x="570" y="546" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2430">Verdict</text>
  <rect x="470" y="558" width="200" height="26" rx="7" fill="#dcfce7"/><text x="480" y="575" font-size="11.5" fill="#166534">match-likely  ·  same piece</text>
  <rect x="470" y="588" width="200" height="26" rx="7" fill="#fef9c3"/><text x="480" y="605" font-size="11.5" fill="#854d0e">inconclusive  (≈40–50 floor)</text>
  <rect x="470" y="618" width="200" height="26" rx="7" fill="#fee2e2"/><text x="480" y="635" font-size="11.5" fill="#991b1b">no-match</text>

  <!-- settings / test panel -->
  <rect x="702" y="524" width="338" height="140" rx="11" fill="#faf7fb" stroke="#e6e2ea"/>
  <text x="716" y="545" font-size="12.5" font-weight="700" fill="#475569">Settings &amp; where to test</text>
  <text x="716" y="566" font-size="10.8" fill="#3f3a48">• AI toggle → EMB_CAP (how many DINOv2 views)</text>
  <text x="716" y="583" font-size="10.8" fill="#3f3a48">• thresholds SIM_LO/HI, MATCH_READY (verify app)</text>
  <text x="716" y="600" font-size="10.8" fill="#3f3a48">• white balance (on by default, anchors to mat)</text>
  <text x="716" y="617" font-size="10.8" fill="#3f3a48">• MARKER_MM → real-world scale (matdetect.py)</text>
  <text x="716" y="634" font-size="10.8" fill="#3f3a48">• C2PA cert: self-signed (untrusted) → Trust-List</text>
  <text x="716" y="654" font-size="10" font-style="italic" fill="#9a3412">Calibrate: enrol, verify vs. a similar piece, set thresholds.</text>

  <text x="40" y="708" font-size="10.5" fill="#94a3b8">Clear glass under-measures &amp; is hard to match on colour — use a backlit pass, a polarizer, and DINOv2 + detail shots. Verdicts are decision support, not forensic proof.</text>
</svg>
